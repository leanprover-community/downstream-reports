name: warm-mathlib-cache (one SHA)

# Per-SHA worker invoked once per matrix entry by warm-mathlib-cache.yml.
# Three jobs:
#
#   build_and_stage  — self-hosted, NO cache token. Clones mathlib at
#                      <sha>, probes the cache, builds Mathlib if
#                      needed, stages .ltar files. Probe and stage run
#                      the target SHA's own in-tree cache tool
#                      (`lake exe cache`): cache file names embed the
#                      tool's hash generation (Cache/IO.lean
#                      rootHashGeneration), so only the tool at <sha>
#                      names files the way consumers at <sha> will
#                      look them up. A master-built tool can sit on a
#                      different generation and would probe/stage
#                      names nobody at <sha> can fetch.
#   upload_cache     — ubuntu, holds the cache credentials. Builds its
#                      own cache tool from a shallow master checkout,
#                      installs the curl release the tool's uploads
#                      need, and runs `put-staged` to the R2 bucket
#                      behind cache.mathlib.org, the store every
#                      consumer reads. The push sets the job's status.
#   verify           — ubuntu, NO token. Independent confirmation that
#                      every Mathlib olean is fetchable: fresh clone,
#                      `cache get`, `lake build --no-build --rehash -v
#                      Mathlib`.
#
# Job chaining: each job exposes its terminal/non-terminal status as a
# job output, and the next job's `if:` skips it when the chain is
# already done. The job that produces a terminal status uploads
# `warm-result-<sha>` directly, so the orchestrator's finalize job always
# has exactly one final result per SHA:
#
#   already_warm | build_failed     → uploaded by build_and_stage
#   push_failed                     → uploaded by upload_cache
#   warmed | verify_failed          → uploaded by verify

on:
  workflow_call:
    inputs:
      sha:
        description: "Mathlib master SHA to warm (40-char hex)."
        type: string
        required: true
      tag:
        description: "Reason for warming this SHA: lkg | fkb | both | manual."
        type: string
        required: true
      downstreams_json:
        description: 'JSON array of downstream names benefitting from this SHA, e.g. ["physlib","FLT"].'
        type: string
        required: true

permissions:
  contents: read
  id-token: write   # required for the OIDC mint in upload_cache

jobs:
  build_and_stage:
    runs-on: [self-hosted, pr]
    outputs:
      status: ${{ steps.write_result.outputs.status }}
    steps:
      # The self-hosted `pr` runner ships no jq. The binary is
      # linux/amd64, which matches this runner label.
      - name: Install jq
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
            -o "$HOME/.local/bin/jq"
          chmod +x "$HOME/.local/bin/jq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Full commit history with blobs deferred, so the next step can
      # run an ancestor check against origin/master.
      - name: Clone mathlib at target SHA
        run: |
          git clone --filter=blob:none https://github.com/leanprover-community/mathlib4 mathlib4

      # Accept SHAs reachable from master and SHAs reachable from a
      # published release tag (e.g. v4.29.1): a downstream that pins a
      # stable release lands its LKG/FKB on a tag that diverged from
      # master, and `lake exe cache get` at that tag reads the warmed
      # oleans. The check refuses everything else, which guards against
      # a typo in `workflow_dispatch shas=...` and a bad SHA from the DB.
      - name: Verify SHA is published (master or release tag)
        env:
          SHA: ${{ inputs.sha }}
        working-directory: mathlib4
        run: |
          if ! git cat-file -e "$SHA"; then
            echo "::error::SHA $SHA does not exist in mathlib4."
            exit 1
          fi
          if git merge-base --is-ancestor "$SHA" origin/master; then
            echo "Confirmed: $SHA is on master."
          elif tags=$(git tag --contains "$SHA") && [ -n "$tags" ]; then
            echo "Confirmed: $SHA is reachable from published tag(s): $(echo "$tags" | paste -sd, -)."
          else
            echo "::error::SHA $SHA is neither on master nor reachable from any published tag. Refusing to warm cache for unpublished SHAs."
            exit 1
          fi

      - name: Checkout SHA
        env:
          SHA: ${{ inputs.sha }}
        run: git -C mathlib4 checkout "$SHA"

      # Shallow master checkout, separate from the target SHA's working
      # tree. It is the leantar backfill source below: its
      # `lean-toolchain` resolves a recent toolchain whose sysroot ships
      # leantar.
      - name: Clone mathlib master (leantar source)
        run: |
          git clone --depth=1 --branch=master \
            https://github.com/leanprover-community/mathlib4 mathlib4-tools

      # The cache binary resolves `leantar` from the active toolchain's
      # sysroot alone (`<lean --print-prefix>/bin/leantar`, see
      # Cache/IO.lean leantarSysrootBin). A target SHA older than
      # nightly-2026-03-09 pins a toolchain without leantar, so cache
      # stage and probe fail with "leantar not found in Lean sysroot".
      # The step copies the master toolchain's leantar into the target
      # sysroot.
      - name: Backfill leantar into target toolchain (if missing)
        run: |
          set -euo pipefail
          # Trigger elan install of both toolchains so --print-prefix resolves.
          ( cd mathlib4         && lean --version ) >/dev/null
          ( cd mathlib4-tools   && lean --version ) >/dev/null
          TARGET_PREFIX=$( cd mathlib4       && lean --print-prefix )
          TOOLS_PREFIX=$(  cd mathlib4-tools && lean --print-prefix )
          if [ -x "$TARGET_PREFIX/bin/leantar" ]; then
            echo "leantar already present in target sysroot: $TARGET_PREFIX/bin/leantar"
            exit 0
          fi
          if [ ! -x "$TOOLS_PREFIX/bin/leantar" ]; then
            echo "::error::No leantar in master tools sysroot ($TOOLS_PREFIX/bin/leantar); cannot backfill."
            exit 1
          fi
          cp "$TOOLS_PREFIX/bin/leantar" "$TARGET_PREFIX/bin/leantar"
          echo "Backfilled leantar: $TOOLS_PREFIX/bin/leantar -> $TARGET_PREFIX/bin/leantar"

      # `lake exe cache` builds and runs the target checkout's own
      # cache tool, so the probe looks up the file names a consumer at
      # this SHA computes. It reads the runner's local cache first, so
      # it measures the runner's view; `verify` is the check that reads
      # what consumers read. A cold cache is the normal reason this
      # workflow runs, so the step always exits 0 and reports warm/cold
      # through `outputs.status`: the expected path leaves no ##[error]
      # annotation, and red in this job marks a real failure. The retry
      # absorbs a transient flake (a cache endpoint 503, a network blip)
      # so a download hiccup on a complete cache does not cost a full
      # build.
      - name: Probe cache completeness
        id: probe
        working-directory: mathlib4
        run: |
          probe() {
            lake exe cache get \
              && lake build --no-build -v Mathlib
          }
          STATUS=cold
          if probe; then
            STATUS=warm
          else
            echo "Probe attempt 1 found the cache incomplete; retrying once to rule out a transient flake..."
            if probe; then
              STATUS=warm
            else
              echo "::notice::Cache incomplete for this SHA; proceeding to build."
            fi
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # The build/stage/push/verify steps get one extra attempt to
      # absorb transient flakes; after the second failure the step
      # reports failure to its `outcome:` and the per-SHA result
      # captures it as build_failed / push_failed / verify_failed.
      - name: Build Mathlib
        id: build
        if: steps.probe.outputs.status != 'warm'
        working-directory: mathlib4
        continue-on-error: true
        run: |
          if ! lake build Mathlib; then
            echo "::warning::Build attempt 1 failed, retrying once..."
            lake build Mathlib
          fi

      - name: Stage cache
        id: stage
        if: steps.build.outcome == 'success'
        working-directory: mathlib4
        continue-on-error: true
        run: |
          stage() {
            lake exe cache stage --staging-dir=../cache-staging
          }
          if ! stage; then
            echo "::warning::Stage attempt 1 failed, retrying once..."
            # Clear the first attempt's partial .ltar output, so the
            # staging artifact holds the second attempt's files alone.
            rm -rf ../cache-staging
            stage
          fi

      # The artifact holds .ltar files only, no binary: upload_cache
      # builds its own cache tool from a master checkout.
      - name: Upload staging artifact
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stage-${{ inputs.sha }}
          path: cache-staging/
          if-no-files-found: error

      - name: Write result
        id: write_result
        if: always()
        env:
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
          DOWNSTREAMS_JSON: ${{ inputs.downstreams_json }}
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
        run: |
          if   [ "$PROBE_STATUS" = "warm" ];       then STATUS=already_warm
          elif [ "$BUILD_OUTCOME" != "success" ];  then STATUS=build_failed
          elif [ "$STAGE_OUTCOME" != "success" ];  then STATUS=build_failed
          else                                          STATUS=staged
          fi
          mkdir -p out
          jq -n \
            --arg sha "$SHA" \
            --arg tag "$TAG" \
            --arg status "$STATUS" \
            --argjson downstreams "$DOWNSTREAMS_JSON" \
            '{sha:$sha, tag:$tag, status:$status, downstreams:$downstreams}' \
            > "out/result.json"
          cat out/result.json
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # Terminal: upload directly as the final result (already_warm,
      # build_failed). The chain stops here.
      - name: Upload final result (terminal)
        if: always() && steps.write_result.outputs.status != 'staged'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: warm-result-${{ inputs.sha }}
          path: out/result.json
          if-no-files-found: error

      # Non-terminal: hand off to upload_cache.
      - name: Upload intermediate result (staged)
        if: steps.write_result.outputs.status == 'staged'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: intermediate-${{ inputs.sha }}
          path: out/result.json
          if-no-files-found: error

  upload_cache:
    needs: build_and_stage
    if: needs.build_and_stage.outputs.status == 'staged'
    runs-on: ubuntu-latest
    # A push failure fails this job (red in the run's job list) after
    # the push_failed result is uploaded; continue-on-error keeps the
    # workflow_run green so publish-lkg + generate-pages still chain.
    continue-on-error: true
    # The environment fixes the OIDC subject claim the broker's
    # `downstream-reports-warm-publish` grant is bound to. Its branch
    # policy admits `main` alone, so the mint is main-only.
    environment:
      name: cache-warming-token
      deployment: false
    outputs:
      status: ${{ steps.write_result.outputs.status }}
    steps:
      - name: Download intermediate result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intermediate-${{ inputs.sha }}
          path: prev

      - name: Download staging artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stage-${{ inputs.sha }}
          path: cache-staging

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The cache tool uploads with curl 8.20 or later (mathlib4#44940);
      # ubuntu-latest ships 8.5. This is the static build mathlib4's own
      # upload job installs, pinned to the same release and checksum.
      - name: Install curl
        env:
          PINNED_CURL_RELEASE: v8.23.0
          PINNED_CURL_SHA256: 83a56256434a3d3f6edbdad2cbdb1f23a44fe8fd52968d18ab57763fdc0afba0
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/curl-install"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 5 -o curl \
            "https://github.com/leanprover-community/static-curl/releases/download/${PINNED_CURL_RELEASE}/curl-x86_64-linux-static"
          echo "${PINNED_CURL_SHA256}  curl" | sha256sum -c -
          chmod u+x curl
          echo "$dir" >> "$GITHUB_PATH"
          ./curl --version

      # Build the cache binary from a master checkout, so the R2
      # credentials below reach only a binary this job built. The
      # master tool is safe across hash generations: `put-staged`
      # uploads the staged .ltar files under the names build_and_stage's
      # in-tree tool gave them and computes no hashes itself.
      - name: Clone mathlib master (cache tool)
        run: |
          git clone --depth=1 --branch=master \
            https://github.com/leanprover-community/mathlib4 mathlib4-tools

      - name: Build cache tool
        working-directory: mathlib4-tools
        run: lake build cache

      # The action exchanges the job's OIDC token at the mathlib cache
      # broker for short-lived S3 credentials. A failed mint fails the
      # step; the result below then records push_failed. The credentials
      # stay out of $GITHUB_ENV: the action masks them and returns them
      # as step outputs, and only the push step maps them into its own
      # `env:`.
      - name: Mint R2 credentials
        id: mint_r2
        uses: leanprover-community/mathlib-ci/.github/actions/mint-s3-credentials@5a931cea32b8a6d5eb166aad4330531fb1e771e6
        with:
          broker-url: ${{ vars.MATHLIB_CACHE_BROKER_URL }}
          audience: mathlib-cache-broker

      # The upload targets the R2 bucket behind cache.mathlib.org, the
      # store every consumer's `lake exe cache get` reads. These are
      # Mathlib oleans at mathlib4 master commits, so they go to the
      # master set. `MATHLIB_CACHE_PUT_URL` names one flat endpoint and
      # turns the container policy off, so `--repo` alone sets the
      # prefix, and `leanprover-community/mathlib4` writes the flat
      # `f/<hash>.ltar` names a mathlib4 consumer reads.
      - name: Push staged cache to R2
        id: push
        continue-on-error: true   # push_failed surfaces in result.json
        working-directory: mathlib4-tools
        env:
          MATHLIB_CACHE_S3_ACCESS_KEY_ID: ${{ steps.mint_r2.outputs.access-key-id }}
          MATHLIB_CACHE_S3_SECRET_ACCESS_KEY: ${{ steps.mint_r2.outputs.secret-access-key }}
          MATHLIB_CACHE_S3_SESSION_TOKEN: ${{ steps.mint_r2.outputs.session-token }}
          # R2 signs every request in the region `auto`.
          MATHLIB_CACHE_S3_REGION: auto
          MATHLIB_CACHE_PUT_URL: ${{ secrets.MATHLIB_CACHE_R2_PUT_URL }}
          # The broker row that matched, for the log line below. It reaches
          # the script through `env:`, not through the command text.
          GRANT: ${{ steps.mint_r2.outputs.grant }}
        run: |
          if [ -z "$MATHLIB_CACHE_PUT_URL" ]; then
            echo "::error::the secret MATHLIB_CACHE_R2_PUT_URL is unset; nothing can be uploaded"
            exit 1
          fi
          push() {
            lake env .lake/build/bin/cache put-staged --backend=s3 \
              --staging-dir=../cache-staging \
              --repo=leanprover-community/mathlib4
          }
          echo "Uploading staged cache to R2 (broker grant: $GRANT)..."
          if ! push; then
            echo "::warning::Push attempt 1 failed, retrying once..."
            push
          fi

      - name: Write result
        id: write_result
        if: always()
        env:
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          mkdir -p out
          if [ "$PUSH_OUTCOME" = "success" ]; then
            STATUS=pushed
          else
            STATUS=push_failed
          fi
          jq --arg status "$STATUS" '.status=$status' prev/result.json > out/result.json
          cat out/result.json
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # Terminal: push_failed becomes the final result.
      - name: Upload final result (push_failed)
        if: always() && steps.write_result.outputs.status == 'push_failed'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: warm-result-${{ inputs.sha }}
          path: out/result.json
          if-no-files-found: error

      # Non-terminal: hand off to verify.
      - name: Upload pushed result
        if: steps.write_result.outputs.status == 'pushed'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pushed-${{ inputs.sha }}
          path: out/result.json
          if-no-files-found: error

      # Last step so the result artifact is already uploaded when the
      # job goes red.
      - name: Fail job on push failure
        if: steps.push.outcome == 'failure'
        run: |
          echo "::error::Cache push failed for ${{ inputs.sha }} after one retry; recorded as push_failed and re-attempted with backoff on future ticks."
          exit 1

  verify:
    needs: upload_cache
    if: needs.upload_cache.outputs.status == 'pushed'
    runs-on: ubuntu-latest
    # A verify failure fails this job (red in the run's job list) after
    # the verify_failed result is uploaded; continue-on-error keeps the
    # workflow_run green so publish-lkg + generate-pages still chain.
    continue-on-error: true
    steps:
      - name: Download pushed result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pushed-${{ inputs.sha }}
          path: prev

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify cache for SHA
        id: verify
        continue-on-error: true   # verify_failed surfaces in result.json
        env:
          SHA: ${{ inputs.sha }}
        run: |
          verify_once() {
            lake exe cache get \
              && lake build --no-build --rehash -v Mathlib
          }
          git clone --filter=blob:none https://github.com/leanprover-community/mathlib4 mathlib4
          git -C mathlib4 fetch origin "$SHA" --depth 1
          git -C mathlib4 checkout "$SHA"
          cd mathlib4
          if ! verify_once; then
            echo "::warning::Verify attempt 1 failed, retrying once..."
            verify_once
          fi

      - name: Write final result
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            STATUS=warmed
          else
            STATUS=verify_failed
          fi
          mkdir -p out
          jq --arg status "$STATUS" '.status=$status' prev/result.json > out/result.json
          cat out/result.json

      - name: Upload final result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: warm-result-${{ inputs.sha }}
          path: out/result.json
          if-no-files-found: error

      # Last step so the result artifact is already uploaded when the
      # job goes red.
      - name: Fail job on verify failure
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::Cache verification failed for ${{ inputs.sha }} after one retry; recorded as verify_failed and re-attempted with backoff on future ticks."
          exit 1
