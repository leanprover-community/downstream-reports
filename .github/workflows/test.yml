name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The pin check compares each pinned commit with HEAD.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt

      - name: Lint
        run: ruff check scripts/

      - name: Run tests
        run: python -m pytest scripts/

      # A pull request that changes a pinned action cannot pin its own commit,
      # so a stale pin is a warning there. On main it fails until a follow-up
      # commit moves the pin.
      - name: Check self-referencing action pins
        run: python scripts/check_self_action_pins.py ${{ github.event_name == 'pull_request' && '--stale-is-warning' || '' }}
